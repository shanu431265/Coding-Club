    <h2>Student Registration Form</h2>
    <p>Please fill this form to join our club.</p>

    <form action="#" method="post">

        <!-- 4.1 Name, Email, Password + Label -->
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" placeholder="e.g. Himanshi" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="himanshi@example.com" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" placeholder="Create Password" required><br><br>

        <!-- 4.2 Date + Phone -->
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" placeholder="98765-43210"><br><br>

        <!-- 4.2 Radio Buttons -->
        <p><strong>Gender:</strong></p>
        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label><br><br>

        <!-- 4.2 Checkboxes -->
        <p><strong>What do you want to learn?</strong></p>
        <input type="checkbox" id="html" name="interest" value="HTML">
        <label for="html">HTML</label>
        <input type="checkbox" id="java" name="interest" value="Java">
        <label for="java">Java</label>
        <input type="checkbox" id="css" name="interest" value="CSS">
        <label for="css">CSS</label><br><br>

        <!-- 4.2 Dropdown -->
        <label for="year">Your Year:</label><br>
        <select id="year" name="year">
            <option value="">-- Select Year --</option>
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select><br><br>

        <!-- 4.2 Textarea -->
        <label for="message">Why do you want to join?</label><br>
        <textarea id="message" name="message" rows="4" cols="35" placeholder="Write here..."></textarea><br><br>

        <!-- 4.2 Submit Button -->
        <input type="submit" value="Register Now">
        <input type="reset" value="Clear Form">

    </form>

    <hr>
    <p>© 2026 Coding Club | Made by Himanshi</p>

</body>
</html>
